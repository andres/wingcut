# 4 m glider: 2 m half-span, cut as 4 panels (centre + tip, left + right).
# Airfoil paths are relative to this file.
name = "glider-4m"
units = "mm"

[[station]]
span = 0                 # centreline
chord = 260
airfoil = "airfoils/naca2412.dat"
le_offset = 0            # sweep: LE x offset, positive = aft
dihedral_offset = 0      # y offset
twist_deg = 0            # positive = nose up, washout negative
twist_pivot = 0.25       # fraction of chord

[[station]]
span = 1000
chord = 220
airfoil = "airfoils/naca2412.dat"
le_offset = 15
twist_deg = -0.5

[[station]]
span = 2000
chord = 140
airfoil = "airfoils/naca2410.dat"
le_offset = 45
dihedral_offset = 35     # polyhedral on the tip panels (~2 deg)
twist_deg = -2.0

# Each panel is one foam block, centred between the towers (1600 - 1000) / 2 = 300.
# block: s_root = face nearest the root tower, x0 = block front (wire enters here),
# y0 = block bottom. side = "left": wing root on the root-tower side;
# "right" mirrors it (wing root on the tip-tower side).
#
# [panel.sheeting]: skin thickness (mm) on top / bottom, and on the front zone
# (both surfaces, round the nose) up to front_to of the chord. The core is cut
# smaller by the skin. Optional: le_cap / te_stock cut the core off flat for a
# balsa LE block / TE strip (chord fractions; 0 / 1 = off).
#
# [[panel.cutout]]: cut in from `surface` at chord fraction x (same on both
# faces), sizes in mm. Shape: width = slot, or angle = V-groove (total opening,
# in degrees). Size: depth below the surface (spar notch), or leave = material
# kept at the opposite surface (hinge: cut from "lower" = hinge on top).

[[panel]]
name = "center-L"
from = 0
to = 1000
block = { s_root = 300, length = 1000, x0 = 100, y0 = 20, height = 60, width = 300 }
side = "left"

[panel.sheeting]          # D-box: 1.5 mm over the front 30 %, 0.6 mm behind
top = 0.6
bottom = 0.6
front = 1.5
front_to = 0.30

[[panel.cutout]]          # upper spar cap slot
surface = "upper"
x = 0.30
width = 10
depth = 2

[[panel.cutout]]          # lower spar cap slot
surface = "lower"
x = 0.30
width = 10
depth = 2

[[panel]]
name = "tip-L"
from = 1000
to = 2000
block = { s_root = 300, length = 1000, x0 = 100, y0 = 20, height = 80, width = 300 }
side = "left"

[panel.sheeting]          # same skin as the centre panels
top = 0.6
bottom = 0.6
front = 1.5
front_to = 0.30

[[panel.cutout]]          # aileron hinge: V cut up from below, 0.5 mm skin left on top
surface = "lower"
x = 0.75
angle = 30
leave = 0.5

[[panel]]
name = "center-R"
from = 0
to = 1000
block = { s_root = 300, length = 1000, x0 = 100, y0 = 20, height = 60, width = 300 }
side = "right"

[panel.sheeting]          # D-box: 1.5 mm over the front 30 %, 0.6 mm behind
top = 0.6
bottom = 0.6
front = 1.5
front_to = 0.30

[[panel.cutout]]          # upper spar cap slot
surface = "upper"
x = 0.30
width = 10
depth = 2

[[panel.cutout]]          # lower spar cap slot
surface = "lower"
x = 0.30
width = 10
depth = 2

[[panel]]
name = "tip-R"
from = 1000
to = 2000
block = { s_root = 300, length = 1000, x0 = 100, y0 = 20, height = 80, width = 300 }
side = "right"

[panel.sheeting]          # same skin as the centre panels
top = 0.6
bottom = 0.6
front = 1.5
front_to = 0.30

[[panel.cutout]]          # aileron hinge: V cut up from below, 0.5 mm skin left on top
surface = "lower"
x = 0.75
angle = 30
leave = 0.5
